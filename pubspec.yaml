name: freesk8_mobile
description: A new Flutter project.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.23.0+51

environment:
  sdk: ^3.13.0
  flutter: 3.47.5 # exact pin: CI installs this version via flutter-version-file

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5 #https://pub.dev/packages/shared_preferences/changelog

  geolocator: ^14.1.1 #https://pub.dev/packages/geolocator/changelog

  flutter_map: ^8.3.2 #https://pub.dev/packages/flutter_map/changelog

  intl: ^0.20.2 #https://pub.dev/packages/intl/changelog

  image_picker: ^1.2.2 #https://pub.dev/packages/image_picker/changelog
  path_provider: ^2.1.5 #https://pub.dev/packages/path_provider/changelog

  community_charts_flutter: ^1.0.4 #https://pub.dev/packages/community_charts_flutter/changelog

  sliding_up_panel: ^2.0.0+1 #https://pub.dev/packages/sliding_up_panel/changelog

  share_plus: ^13.3.0 #https://pub.dev/packages/share_plus/changelog

  wakelock_plus: ^1.8.0 #https://pub.dev/packages/wakelock_plus/changelog

  multiselect_formfield: ^0.1.7 #https://pub.dev/packages/multiselect_formfield/changelog

  table_calendar: ^3.2.1 #https://pub.dev/packages/table_calendar/changelog

  nordic_dfu: ^8.1.0 #https://pub.dev/packages/nordic_dfu/changelog (maintained successor of flutter_nordic_dfu)

  wifi_iot: ^0.3.19+3 #https://pub.dev/packages/wifi_iot/changelog

  device_info_plus: ^13.1.0 #https://pub.dev/packages/device_info_plus/changelog

  duration_picker: ^1.2.0

  sqflite: ^2.4.4 #https://pub.dev/packages/sqflite/changelog

  archive: ^4.3.0 #https://pub.dev/packages/archive/changelog

  flutter_document_picker: ^5.2.3 #https://pub.dev/packages/flutter_document_picker/changelog

  url_launcher: ^6.3.2 #https://pub.dev/packages/url_launcher/changelog

  uuid: ^4.6.0 #https://pub.dev/packages/uuid/changelog

  flutter_slidable: ^4.0.3 #https://pub.dev/packages/flutter_slidable/changelog

  signal_strength_indicator: ^0.5.0 #https://pub.dev/packages/signal_strength_indicator/changelog

  flutter_spinkit: ^5.2.2 #https://pub.dev/packages/flutter_spinkit/changelog

  image: ^4.10.1 #https://pub.dev/packages/image/changelog

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  sensors_plus: ^7.1.0 # shake detection for the debug log console

  rxdart: ^0.28.0

  # Imported directly; declared so a transitive change cannot remove them.
  logger: ^2.7.0
  latlong2: ^0.9.1
  http: ^1.6.0
  path: ^1.9.1
  flutter_blue_plus: ^2.3.13

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4 #https://pub.dev/packages/flutter_launcher_icons/changelog

#android can use transparent BG
#ios use whiteBG
flutter_icons:
  android: true
  ios: true
  image_path: "assets/FreeSK8_Icon_WhiteBG.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/FreeSK8_Icon.png
    - assets/FreeSK8_Icon_Dark.png
    - assets/firmware/Robogotchi_0.10.2.zip
    - assets/robogotchi_render.png
    - assets/FreeSK8_Mobile.png
    - assets/FreeSK8_MobileLogo.png
    - assets/map_fault.png
    - assets/map_start.png
    - assets/map_end.png
    - assets/map_position.png
    - assets/map_selection.png
    - assets/map_top_speed.png
    - assets/map_max_amps.png
    - assets/map_max_temp.png
    - assets/map_efficiency.png
    - assets/dri_about.png
    - assets/dri_icon.png
    - assets/dri_about_serious.gif
    - assets/butt.png
