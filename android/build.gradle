allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Compatibility shims for unmaintained pub packages under AGP 8:
// - namespace: AGP 8 requires one per module; derive it from the manifest's
//   package attribute (the pre-AGP8 convention).
// - JVM targets: old plugins mix Java 1.8 with whatever Kotlin defaults to
//   (the host JDK), which Kotlin 2.x rejects; pin both to 11 everywhere.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def android = project.android
            if (android.hasProperty('namespace') && android.namespace == null) {
                def manifest = project.file('src/main/AndroidManifest.xml')
                if (manifest.exists()) {
                    def packageName = new groovy.xml.XmlSlurper().parse(manifest).@package.text()
                    if (packageName) {
                        android.namespace = packageName
                    }
                }
            }
            android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        project.tasks.matching { it.name.contains('Kotlin') && it.hasProperty('kotlinOptions') }.configureEach { task ->
            task.kotlinOptions.jvmTarget = '11'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
