# Android build + release workflow for FreeSK8 Mobile.
#
# Trigger policy:
#   - push to master        -> build, analyze, test; upload the APK as a 30-day artifact.
#   - push of a tag  vX.Y.Z -> same build, then publish a GitHub Release with the
#                              APK attached. The tag must equal "v" + the pubspec
#                              version name (a "-suffix" marks a pre-release).
#   - workflow_dispatch     -> manual build of any ref (apk or appbundle). A Release
#                              is published only when dispatched on a v* tag ref with
#                              publish_release=true (e.g. to retry a failed upload).
#
# Signing: set repository variable HAS_SIGNING=true plus the secrets
# KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (see CI_GUIDE.md).
# Without them the APK is debug-signed, named "-debug-signed", and any Release
# built from it is marked as a pre-release.

name: Android Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: "Artifact type to build"
        required: false
        default: apk
        type: choice
        options: [apk, appbundle]
      publish_release:
        description: "Publish a GitHub Release (only honoured when dispatched on a v* tag ref)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      signed: ${{ steps.signing.outputs.signed }}
      artifact: ${{ steps.pack.outputs.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The Flutter version is pinned in pubspec.yaml (environment.flutter).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Read version from pubspec
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          full=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?).*/\1/p' pubspec.yaml | head -n1)
          [[ -n "$full" ]] || { echo "::error::no 'version:' line found in pubspec.yaml"; exit 1; }
          name=${full%%+*}
          grep -Eq "^const String freeSK8ApplicationVersion = \"${name}\";" lib/main.dart \
            || { echo "::error::lib/main.dart freeSK8ApplicationVersion does not equal pubspec version ${name}"; exit 1; }
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "full=${full}" >> "$GITHUB_OUTPUT"
          echo "pubspec version ${full}"

      - name: Verify tag matches pubspec version
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          WANT: v${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" != "$WANT" && "$tag" != "$WANT"-* ]]; then
            echo "::error::tag ${tag} does not match pubspec version (${WANT} or ${WANT}-<suffix>)"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then pre=true; else pre=false; fi
          echo "prerelease=${pre}" >> "$GITHUB_OUTPUT"
          echo "tag ${tag} ok (prerelease=${pre})"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The ESC configuration serializers are generated from vendored VESC
      # firmware sources; fail if someone edited them by hand or forgot to
      # re-run the generator.
      - name: Check generated ESC serializers
        run: python3 tool/esc_serializers/generate.py --check

      # Analyzer errors and warnings fail the build; lint infos (flutter_lints via
      # analysis_options.yaml) are advisory.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Secrets are passed through the environment and written with printf so
      # that password characters such as $ or ` are never shell-expanded.
      - name: Configure release signing
        id: signing
        if: vars.HAS_SIGNING == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?missing}" "${STORE_PASSWORD:?missing}" "${KEY_PASSWORD:?missing}" "${KEY_ALIAS:?missing}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release.keystore\n'
          } > android/key.properties
          chmod 600 android/app/release.keystore android/key.properties
          keytool -list -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        if: inputs.build_type != 'appbundle'
        run: flutter build apk --release

      - name: Build App Bundle
        if: inputs.build_type == 'appbundle'
        run: flutter build appbundle --release

      - name: Verify APK signer and package artifact
        id: pack
        if: inputs.build_type != 'appbundle'
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if [[ "${SIGNED}" == "true" ]] && grep -q "CN=Android Debug" certs.txt; then
            echo "::error::HAS_SIGNING is true but the APK is debug-signed"
            exit 1
          fi
          if [[ "${SIGNED}" == "true" ]]; then sign=signed; else sign=debug-signed; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="$GITHUB_REF_NAME"
          else
            ver="${VERSION_NAME}-g${GITHUB_SHA::7}"
          fi
          file="freesk8_mobile-${ver}-${sign}.apk"
          mkdir -p dist
          cp "$apk" "dist/${file}"
          (cd dist && sha256sum "${file}" > "${file}.sha256")
          ls -l dist
          echo "artifact=freesk8_mobile-${ver}-${sign}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: inputs.build_type != 'appbundle'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Upload AAB artifact
        if: inputs.build_type == 'appbundle'
        uses: actions/upload-artifact@v5
        with:
          name: freesk8-mobile-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Compose release notes
        shell: bash
        env:
          VER: ${{ needs.build.outputs.version_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          {
            awk -v v="v${VER}" '$0 == v {found=1; next} /^v[0-9]/ {if (found) exit} found' CHANGELOG
            echo
            if [[ "${SIGNED}" != "true" ]]; then
              echo "> **Warning:** this APK is debug-signed (test build). It cannot be upgraded in place by a future signed release; uninstall it before installing a signed build."
              echo
            fi
            echo "SHA-256:"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FreeSK8 Mobile ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' || needs.build.outputs.signed != 'true' }}
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
